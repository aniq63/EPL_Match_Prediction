name: ETL + ML Pipeline

on:
  schedule:
    # Tue & Fri at 02:00 UTC
    - cron: "0 2 * * 2,5"
  workflow_dispatch: {}

jobs:
  etl:
    runs-on: ubuntu-latest
    outputs:
      new_samples: ${{ steps.count.outputs.new_samples }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Row count BEFORE extraction
        id: before
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, pandas as pd
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              try:
                  count = conn.execute(text('SELECT COUNT(*) FROM matches')).scalar()
              except Exception:
                  count = 0
          print(f'count={count}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={count}\n')
          "

      - name: Run ETL pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.pipelines.etl_pipeline

      - name: Row count AFTER extraction
        id: count
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, pandas as pd
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              after = conn.execute(text('SELECT COUNT(*) FROM matches')).scalar()
          before = ${{ steps.before.outputs.count }}
          new_samples = after - before
          print(f'New samples since last run: {new_samples}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'new_samples={new_samples}\n')
          "

  train:
    needs: etl
    if: needs.etl.outputs.new_samples >= 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML pipeline (train → evaluate → register → promote)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m src.pipelines.ml_pipeline
